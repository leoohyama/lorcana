name: JustTCG Daily Price Pull (Cloud Edition)

on:  
  schedule:    
    - cron: '23 4 * * *'  
  workflow_dispatch: 

jobs:  
  pull-prices:    
    runs-on: ubuntu-latest    
    env:      
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}      
      TZ: 'America/New_York'    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4      
        
      - name: 🛠️ Setup R        
        uses: r-lib/actions/setup-r@v2        
        with:          
          r-version: 'release'          
          use-public-rspm: false # Turn off the default 'latest' manager
          
      - name: ⏱️ Install Packages via Time-Travel Snapshot
        # This points to a frozen date before the DuckDB 1.5.4 update broke things.
        # It downloads pre-compiled Ubuntu binaries in seconds. No compiling!
        run: |
          Rscript -e 'install.packages(c("tidyverse", "jsonlite", "httr", "DBI", "duckdb"), repos = "https://packagemanager.posit.co/cran/2024-10-15")'
            
      - name: 🚀 Run Daily Price Scraper & Push to MotherDuck        
        env:          
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: Rscript pull_daily_prices.R
