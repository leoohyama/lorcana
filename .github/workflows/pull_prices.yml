name: JustTCG Daily Price Pull (Local Mac Edition)

on:  
  schedule:    
    - cron: '23 4 * * *'  
  workflow_dispatch: 

jobs:  
  pull-prices:    
    runs-on: self-hosted    # 💻 Routes directly to your MacBook Air
    env:      
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}      
      TZ: 'America/New_York'    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4      
        
      # Notice we completely deleted the R Setup and Package Install steps!
      # We are relying entirely on the pristine environment already on your Mac.

      - name: 🚀 Run Daily Price Scraper & Push to MotherDuck        
        env:          
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: Rscript pull_daily_prices.R
