name: Update Time Series Metrics

on:
  schedule:
    - cron: '30 4 * * *' # Or whatever time you have set
  workflow_dispatch: 

jobs:
  run-metrics:
    runs-on: self-hosted    # 💻 Routes directly to your MacBook Air!

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # We delete all the R setup and package installation steps!
      # Your Mac already has 1.5.2 and all the math packages perfectly installed.

      - name: 🧮 Run Metrics Pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/postprocessing/update_ts_metrics.R
