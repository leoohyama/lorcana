name: eBay Daily Market Float (Local Mac Edition)

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch: 

jobs:
  # ==========================================
  # JOB 1: THE SCRAPER (Runs on your Mac)
  # ==========================================
  run-ebay-scraper:
    runs-on: self-hosted    # 💻 Moved from ubuntu-latest to your MacBook Air

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TZ: 'America/New_York' 

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # Notice the 15-minute R setup and package installations are entirely gone!
      # We rely on the pristine R 1.5.2 environment already living on your Mac.

      - name: 🚀 Run eBay API & Push to MotherDuck
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/ingestion/ebay_api_download.R

  # ==========================================
  # JOB 2: THE AI METADATA CLEANER (Runs on your Mac)
  # ==========================================
  run-gemma-cleaner:
    needs: run-ebay-scraper # Crucial: Waits for the scraper to finish
    runs-on: self-hosted    # 💻 Routes to your MacBook Air

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🧠 Wake up Ollama
        run: |
          nohup /usr/local/bin/ollama serve > ollama.log 2>&1 &
          sleep 5 
          curl -I http://localhost:11434/ || echo "Ollama failed to start"
          # Pre-load the model. A cold load of gemma4:e2b takes ~13s, which used
          # to be charged to the first inference call and blow its per-call
          # timeout — enough consecutive failures trips the "first 25 calls
          # failed" abort. keep_alive holds it resident across both gemma jobs.
          curl -s -m 300 http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d '{"model":"gemma4:e2b","keep_alive":"30m"}' || echo "Model pre-warm failed"
          curl -s -m 10 http://localhost:11434/api/ps

      - name: 🧹 Run Gemma Cleaner
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/cleaning/run_gemma_cleaner.R

  # ==========================================
  # JOB 3: THE AI DEDUPER (Runs on your Mac)
  # ==========================================
  run-gemma-deduper:
    needs: run-gemma-cleaner # Crucial: Waits for Job 2 so we don't overload Ollama
    runs-on: self-hosted     # 💻 Routes to your MacBook Air

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🧠 Wake up Ollama
        run: |
          nohup /usr/local/bin/ollama serve > ollama.log 2>&1 &
          sleep 5 
          curl -I http://localhost:11434/ || echo "Ollama failed to start"
          # Pre-load the model. A cold load of gemma4:e2b takes ~13s, which used
          # to be charged to the first inference call and blow its per-call
          # timeout — enough consecutive failures trips the "first 25 calls
          # failed" abort. keep_alive holds it resident across both gemma jobs.
          curl -s -m 300 http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d '{"model":"gemma4:e2b","keep_alive":"30m"}' || echo "Model pre-warm failed"
          curl -s -m 10 http://localhost:11434/api/ps

      - name: ✂️ Run Gemma Deduplication
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/cleaning/dedupe_gemma4.R