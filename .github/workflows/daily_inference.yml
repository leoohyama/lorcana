name: Daily Lorcana Market Inference

on:
  workflow_run:
    workflows: ["JustTCG Daily Price Pull (Local Mac Edition)"]
    types:
      - completed
  workflow_dispatch: 

jobs:
  run-inference-pipeline:
    runs-on: self-hosted
    timeout-minutes: 30 
    # CRITICAL: Only run if the price pull succeeded, or if you clicked the manual button
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 1. Run PyTorch Preprocessing
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/preprocessing/preprocessing.R

      - name: ⏱️ 2. Run Chronos Preprocessing
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/preprocessing/chronos_data_processing.R

      - name: 🔮 3. Run GRU Future Inference
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: /Users/leoohyama/opt/miniconda3/envs/lorcana-ml/bin/python pipeline/inference/daily_inference_gru.py

      - name: 🚀 4. Run Chronos Future Inference
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: /Users/leoohyama/opt/miniconda3/envs/lorcana-ml/bin/python pipeline/modeling/chronos_transfer_learning.py

      - name: 🧮 5. Calculate Live Residuals (MotherDuck)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/postprocessing/update_residuals.R

      - name: 📦 6. Sync Daily Data to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📈 Auto-infer: Daily forecasts & residuals updated in MotherDuck"
          file_pattern: 'data/*.csv'
          push_options: '--force'

      - name: 📉 7. Calculate and Upload Backtest Metrics
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: Rscript pipeline/postprocessing/calculate_backtest_metrics.R
