name: Daily Dashboard Render

on:  
  workflow_run:    
    # This listens for your MacBook to finish its ML job!    
    workflows: ["eBay Daily Market Float (Cloud + Local AI)"]    
    types:      
      - completed    
  # Keep the manual button just in case  
  workflow_dispatch: 

jobs:  
  render-site:    
    runs-on: ubuntu-latest    
    # CRITICAL: Only render if the MacBook ML pipeline succeeded    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0
          # Force checkout of the absolute latest main branch to prevent push conflicts
          ref: main 

      - name: 🛠️ Setup R        
        id: setup-r
        uses: r-lib/actions/setup-r@v2        
        with:          
          use-public-rspm: true        

      - name: 📦 Install R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # We use the '@' symbol to instantly grab the pre-compiled binary 
          # of 1.5.2, bypassing the 15-minute source compile entirely!
          packages: |
            any::tidyverse
            any::DBI
            any::httr
            any::jsonlite
            duckdb@1.5.2

      - name: 🔍 Verify installed duckdb version
        run: Rscript -e 'cat("duckdb version in use:", as.character(packageVersion("duckdb")), "\n")'

      - name: 📝 Setup Quarto        
        uses: quarto-dev/quarto-actions/setup@v2      

      - name: 📊 Render Dashboard        
        env:          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: quarto render index.qmd      

      - name: 🚀 Commit and Push        
        uses: stefanzweifel/git-auto-commit-action@v5        
        with:          
          commit_message: "🌐 Auto-render: Daily Quarto dashboard update"          
          file_pattern: 'docs/*'
