name: Daily Dashboard Render

on:  
  workflow_run:    
    workflows: ["eBay Daily Market Float (Cloud + Local AI)"]    
    types:      
      - completed    
  workflow_dispatch: 

jobs:  
  render-site:    
    runs-on: ubuntu-latest    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0
          ref: main 

      - name: 🛠️ Setup R        
        uses: r-lib/actions/setup-r@v2        
        with:          
          use-public-rspm: true        

      - name: 📦 Install R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::DBI

      - name: 🦆 Force Install Supported DuckDB
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_version("duckdb", version = "1.5.3")'

      - name: 📝 Setup Quarto        
        uses: quarto-dev/quarto-actions/setup@v2      

      - name: 📊 Render Dashboard        
        env:          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: quarto render index.qmd      

      - name: 🚀 Commit and Push        
        uses: stefanzweifel/git-auto-commit-action@v5        
        with:          
          commit_message: "🌐 Auto-render: Daily Quarto dashboard update"          
          file_pattern: 'docs/*'
