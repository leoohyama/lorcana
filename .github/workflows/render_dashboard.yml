name: Daily Dashboard Render

on:  
  workflow_run:    
    workflows: ["eBay Daily Market Float (Cloud + Local AI)"]    
    types:      
      - completed    
  workflow_dispatch: 

jobs:  
  render-site:    
    runs-on: self-hosted    # 💻 Routes directly to your MacBook Air!
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0
          ref: main 

      # Notice we completely deleted the 15-minute R package installation steps.
      # Your Mac already has tidyverse, duckdb, and DBI installed!

      - name: 📝 Setup Quarto        
        uses: quarto-dev/quarto-actions/setup@v2      

      - name: 📊 Render Dashboard        
        env:          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        # Uses your Mac's native R processing power to render the dashboard
        run: quarto render index.qmd      

      - name: 🚀 Commit and Push        
        uses: stefanzweifel/git-auto-commit-action@v5        
        with:          
          commit_message: "🌐 Auto-render: Daily Quarto dashboard update"          
          file_pattern: 'docs/*'
