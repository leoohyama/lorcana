name: Daily Dashboard Render

on:  
  workflow_run:    
    # This listens for your MacBook to finish its ML job!    
    workflows: ["eBay Daily Market Float (Cloud + Local AI)"]    
    types:      
      - completed    
  # Keep the manual button just in case  
  workflow_dispatch: 

jobs:  
  render-site:    
    runs-on: ubuntu-latest    
    # CRITICAL: Only render if the MacBook ML pipeline succeeded    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0
          # Force checkout of the absolute latest main branch to prevent push conflicts
          ref: main 

      - name: 🛠️ Setup R        
        uses: r-lib/actions/setup-r@v2        
        with:          
          use-public-rspm: true        

      - name: 📦 Install R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Using 'packages' instead of 'extra-packages' prevents it from scanning 
          # your entire repository and only installs exactly what Quarto needs.
          packages: |
            any::tidyverse
            any::DBI
            any::duckdb
            any::httr
            any::jsonlite

      - name: 📝 Setup Quarto        
        uses: quarto-dev/quarto-actions/setup@v2      

      - name: 📊 Render Dashboard        
        env:          
          # Give Quarto access to Neon/MotherDuck to pull the fresh data          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: quarto render index.qmd      

      - name: 🚀 Commit and Push        
        # Using the exact same auto-commit action you already trust        
        uses: stefanzweifel/git-auto-commit-action@v5        
        with:          
          commit_message: "🌐 Auto-render: Daily Quarto dashboard update"          
          file_pattern: 'docs/*'
