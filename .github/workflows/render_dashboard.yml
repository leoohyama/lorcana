name: Daily Dashboard Render

on:  
  workflow_run:    
    workflows: ["eBay Daily Market Float (Local Mac Edition)"]    
    types:      
      - completed    
  workflow_dispatch: 

jobs:  
  render-site:    
    runs-on: self-hosted    # 💻 Routes directly to your MacBook Air
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}    
    
    steps:      
      - name: 📥 Checkout Repository        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0
          ref: main 

      # We deleted BOTH the R setup and Quarto setup steps!
      # It will instantly use the R and Quarto installations already living on your Mac.

      - name: 📊 Render Dashboard        
        env:          
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}        
        run: quarto render Lorecaster.qmd      

      - name: 🚀 Commit and Push        
        uses: stefanzweifel/git-auto-commit-action@v5        
        with:          
          commit_message: "🌐 Auto-render: Daily Quarto dashboard update"          
          file_pattern: 'docs/*'
